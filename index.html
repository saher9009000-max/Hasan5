<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم احترافي | Professional Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط الأدوات العلوي -->
    <header class="toolbar">
        <!-- 1. زر الوضع الداكن -->
        <button id="themeToggle" class="icon-btn" title="تبديل الوضع الداكن">🌙</button>
        
        <!-- 2. زر إعدادات API -->
        <button id="apiBtn" class="icon-btn" title="إعداد مفتاح API">🔑</button>
        
        <!-- 7. زر الإعدادات (الإصدار) -->
        <button id="settingsBtn" class="icon-btn" title="الإعدادات">⚙️</button>
        
        <!-- 8. زر مسح السجل -->
        <button id="clearHistoryBtn" class="text-btn" title="مسح سجل الترجمة">🗑️ مسح السجل</button>
    </header>

    <!-- منطقة الترجمة الرئيسية -->
    <main class="container">
        <!-- 3. تبديل اللغات -->
        <div class="lang-selector">
            <select id="sourceLang">
                <option value="auto">كشف تلقائي</option>
                <!-- سيتم تعبئتها بواسطة JavaScript (أكثر من 100 لغة) -->
            </select>
            <button id="swapLang" class="swap-btn" title="تبديل اللغات">⇄</button>
            <select id="targetLang">
                <option value="ar">العربية</option>
            </select>
        </div>

        <!-- صندوق الإدخال -->
        <div class="input-area">
            <textarea id="inputText" placeholder="أدخل النص هنا..."></textarea>
            
            <!-- 4. زر استيراد الملفات + 5. زر الترجمة الصوتية -->
            <div class="action-bar">
                <label for="fileInput" class="file-label" title="استيراد ملف">📁 استيراد ملف</label>
                <input type="file" id="fileInput" accept=".txt,.pdf,.docx" hidden>
                
                <button id="voiceBtn" class="mic-btn" title="الترجمة الصوتية">🎤 صوت</button>
            </div>
        </div>

        <!-- نتيجة الترجمة -->
        <div class="output-area">
            <textarea id="outputText" readonly placeholder="الترجمة تظهر هنا..."></textarea>
        </div>

        <!-- زر الترجمة الرئيسي -->
        <button id="translateBtn" class="primary-btn">ترجم الآن</button>

        <!-- منطقة سجل الترجمة -->
        <div class="history-section">
            <h3>سجل الترجمة</h3>
            <ul id="historyList"></ul>
        </div>
    </main>

    <!-- 7. نافذة الإعدادات (تحتوي على رقم الإصدار) -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>إعدادات النظام</h2>
            <p>رقم الإصدار: <strong id="versionDisplay">v1.0.0</strong></p>
            <hr>
            <p>معلومات المطور: Professional Translator</p>
            <p>© 2026 جميع الحقوق محفوظة</p>
        </div>
    </div>

    <!-- نافذة إعدادات API (منبثقة) -->
    <div id="apiModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn api-close">&times;</span>
            <h2>إعداد مفتاح API</h2>
            <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح Google Translate API">
            <button id="saveApiBtn" class="primary-btn">حفظ المفتاح</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
