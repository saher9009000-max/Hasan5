<!-- الشريط العلوي -->
<header class="top-bar">
  <div class="right-controls">
    <button id="themeToggleBtn" class="icon-btn" title="تبديل ألوان الموقع / الوضع الداكن">🌙</button>
  </div>
  <div class="left-controls">
    <!-- زر ستيغ على أقصى اليسار -->
    <button id="settingsBtn" class="settings-btn">⚙️ ستيغ</button>
  </div>
</header>

<!-- لوحة الإعدادات (تفتح عند الضغط على زر ستيغ) -->
<div id="settingsPanel" class="settings-panel hidden">
  <div class="setting-group">
    <label>خانة لصق مفتاح API:</label>
    <div class="input-row">
      <input type="text" id="apiKeyInput" placeholder="أدخل مفتاح API هنا...">
      <button id="pasteBtn" class="action-btn">لصق</button>
    </div>
  </div>

  <div class="setting-group">
    <label>خانة رابط موقع API (SPI):</label>
    <input type="text" id="spiInput" placeholder="https://api.example.com">
  </div>

  <div class="setting-group">
    <button id="testBtn" class="primary-btn">زر تجربة اتصال</button>
    <span id="testStatus"></span>
  </div>
</div>

<!-- قسم اللغات والترجمة -->
<section class="translation-section">
  <!-- خانات اللغات -->
  <div class="languages-row">
    <div class="lang-box active-lang">🇸🇦 العربية (الافتراضية)</div>
    <div class="lang-box">🇬🇧 الإنكليزية</div>
  </div>

  <!-- خانات الترجمة -->
  <div class="translation-modes-row">
    <div class="mode-box">
      <h3>الترجمة العادية</h3>
      <textarea placeholder="النص للترجمة العادية..."></textarea>
    </div>
    
    <div class="mode-box">
      <h3>الترجمة بذكاء الاصطناعي</h3>
      <textarea placeholder="النص للترجمة بالذكاء الاصطناعي..."></textarea>
      
      <!-- اختيار نموذج الذكاء الاصطناعي (بدون اختيار افتراضي مسبق) -->
      <div class="ai-options-group">
        <label for="aiModelSelect">اختر نموذج الذكاء الاصطناعي:</label>
        <select id="aiModelSelect">
          <option value="" disabled selected>-- الرجاء الاختيار --</option>
          <option value="model-a">النموذج الأول</option>
          <option value="model-b">النموذج الثاني</option>
          <option value="model-c">النموذج الثالث</option>
        </select>
      </div>

      <!-- خانة الترجمة الصوتية باحترافية عالية -->
      <div class="voice-translation-group">
        <button id="voiceBtn" class="voice-btn">🎤 ترجمة صوتية باحترافية عالية</button>
        <span id="voiceStatus">جاهز للاستماع...</span>
      </div>
    </div>
  </div>
</section>
