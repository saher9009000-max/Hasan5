<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المترجم الذكي</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ===== Header ===== -->
    <header class="header">
      <div class="brand">
        <span class="logo">🌐</span>
        <h1>المترجم الذكي</h1>
      </div>

      <div class="header-actions">
        <select id="modelSelect" class="model-select" disabled>
          <option value="">— لا يوجد نموذج —</option>
        </select>
        <button id="refreshModelsBtn" class="btn-icon" title="تحديث قائمة النماذج">⟳</button>
        <button id="openSettingsBtn" class="btn-icon" title="الإعدادات">⚙️</button>
      </div>
    </header>

    <!-- ===== Main ===== -->
    <main class="main">
      <!-- Source panel -->
      <section class="panel">
        <div class="panel-header">
          <span class="panel-title">النص الأصلي</span>
          <select id="sourceLang" class="lang-select">
            <option value="auto">كشف تلقائي</option>
            <option value="English">الإنجليزية</option>
            <option value="Arabic" selected>العربية</option>
            <option value="French">الفرنسية</option>
            <option value="Spanish">الإسبانية</option>
            <option value="German">الألمانية</option>
            <option value="Turkish">التركية</option>
            <option value="Russian">الروسية</option>
            <option value="Chinese">الصينية</option>
            <option value="Japanese">اليابانية</option>
            <option value="Korean">الكورية</option>
            <option value="Italian">الإيطالية</option>
            <option value="Portuguese">البرتغالية</option>
            <option value="Hindi">الهندية</option>
            <option value="Urdu">الأردية</option>
            <option value="Persian">الفارسية</option>
          </select>
        </div>
        <textarea id="sourceText" placeholder="اكتب أو الصق النص الذي تريد ترجمته هنا..."></textarea>
        <div class="panel-footer">
          <span id="charCount" class="counter">0 حرف</span>
        </div>
      </section>

      <!-- Controls -->
      <div class="controls">
        <button id="translateBtn" class="btn-primary">
          <span>ترجم</span>
          <span class="arrow">←</span>
        </button>
        <button id="swapBtn" class="btn-icon" title="تبديل اللغات">⇄</button>
        <button id="copyBtn" class="btn-icon" title="نسخ الترجمة">📋</button>
        <button id="clearBtn" class="btn-icon" title="مسح الكل">🗑️</button>
      </div>

      <!-- Target panel -->
      <section class="panel">
        <div class="panel-header">
          <span class="panel-title">الترجمة</span>
          <select id="targetLang" class="lang-select">
            <option value="English" selected>الإنجليزية</option>
            <option value="Arabic">العربية</option>
            <option value="French">الفرنسية</option>
            <option value="Spanish">الإسبانية</option>
            <option value="German">الألمانية</option>
            <option value="Turkish">التركية</option>
            <option value="Russian">الروسية</option>
            <option value="Chinese">الصينية</option>
            <option value="Japanese">اليابانية</option>
            <option value="Korean">الكورية</option>
            <option value="Italian">الإيطالية</option>
            <option value="Portuguese">البرتغالية</option>
            <option value="Hindi">الهندية</option>
            <option value="Urdu">الأردية</option>
            <option value="Persian">الفارسية</option>
          </select>
        </div>
        <textarea id="outputText" readonly placeholder="ستظهر الترجمة هنا..."></textarea>
        <div class="panel-footer">
          <span id="statusMsg" class="status"></span>
        </div>
      </section>
    </main>
  </div>

  <!-- ===== Settings Modal ===== -->
  <div id="settingsModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>إعدادات الاتصال</h2>
        <button id="closeSettingsBtn" class="btn-icon" title="إغلاق">✕</button>
      </div>

      <div class="modal-body">
        <div class="field">
          <label for="endpointInput">API Endpoint URL</label>
          <input
            type="text"
            id="endpointInput"
            placeholder="https://api.groq.com/openai/v1"
            dir="ltr"
            autocomplete="off"
          />
          <small>
            أمثلة: <code>https://api.openai.com/v1</code> — 
            <code>https://api.groq.com/openai/v1</code> — 
            <code>https://openrouter.ai/api/v1</code>
          </small>
        </div>

        <div class="field">
          <label for="apiKeyInput">API Key</label>
          <input
            type="password"
            id="apiKeyInput"
            placeholder="sk-..."
            dir="ltr"
            autocomplete="off"
          />
          <small>يتم تخزين المفتاح محلياً في متصفحك فقط (LocalStorage).</small>
        </div>

        <div class="modal-actions">
          <button id="saveSettingsBtn" class="btn-primary">حفظ وتحميل النماذج</button>
          <button id="clearSettingsBtn" class="btn-secondary">مسح البيانات</button>
        </div>

        <div id="settingsStatus" class="status"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
