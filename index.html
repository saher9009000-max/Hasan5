<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14b8a6" />
  <meta name="description" content="مترجم توركواز — ترجمة احترافية بثلاثة أوضاع: احترافي، قياسي، ذكاء اصطناعي." />
  <title>مترجم توركواز</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ==================== Header ==================== -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">🌐</div>
      <div>
        <h1>مترجم توركواز</h1>
        <p class="brand-sub">ترجمة احترافية بثلاثة أوضاع</p>
      </div>
    </div>

    <div class="menu-wrap">
      <button class="icon-btn" id="menuToggle" aria-label="إعدادات إضافية" aria-expanded="false" aria-controls="dropdownMenu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/>
          <circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>
        </svg>
      </button>

      <div class="dropdown" id="dropdownMenu" hidden role="menu">
        <button class="dropdown-item" id="colorsBtn" role="menuitem">
          <span class="di-icon">🎨</span>
          <span>ألوان الموقع</span>
        </button>

        <button class="dropdown-item" id="clearHistoryBtn" role="menuitem">
          <span class="di-icon">🗑️</span>
          <span>مسح السجل</span>
        </button>

        <label class="dropdown-item" role="menuitemcheckbox">
          <span class="di-icon">🌙</span>
          <span>الوضع الداكن</span>
          <input type="checkbox" id="darkModeToggle" />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>
    </div>
  </header>

  <!-- ==================== Main ==================== -->
  <main>
    <!-- API Settings -->
    <section class="card">
      <div class="card-head">
        <h2>إعدادات الاتصال</h2>
        <span class="badge">API</span>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="apiKey">مفتاح API</label>
          <input type="password" id="apiKey" placeholder="أدخل مفتاح API..." autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label for="endpoint">عنوان URL لنقطة النهاية</label>
          <input type="url" id="endpoint" placeholder="https://api.example.com/translate" autocomplete="off" spellcheck="false" />
        </div>
      </div>
      <p class="hint">اترك الحقلين فارغين لاستخدام خدمة العرض التجريبي المجانية (MyMemory).</p>
    </section>

    <!-- Options -->
    <section class="card">
      <div class="lang-grid">
        <div class="field">
          <label for="sourceLang">اللغة المصدر</label>
          <select id="sourceLang"></select>
        </div>

        <button class="swap-btn" id="swapLangs" title="تبديل اللغات" aria-label="تبديل اللغات">⇄</button>

        <div class="field">
          <label for="targetLang">اللغة الهدف</label>
          <select id="targetLang"></select>
        </div>

        <div class="field">
          <label for="model">نموذج الترجمة</label>
          <select id="model">
            <option value="professional">🏆 احترافي</option>
            <option value="standard">⚡ قياسي</option>
            <option value="ai">🤖 مدعوم بالذكاء الاصطناعي</option>
          </select>
        </div>
      </div>

      <div class="row-end">
        <button class="btn ghost" id="importBtn">
          <span aria-hidden="true">📁</span> استيراد ملفات
        </button>
        <input type="file" id="fileInput" accept=".txt,.md,.csv,.json,.srt" multiple hidden />
      </div>
    </section>

    <!-- Translator -->
    <section class="translator-grid">
      <div class="card">
        <div class="card-head">
          <label for="inputText">النص الأصلي</label>
          <span class="count" id="inputCount">0 حرف</span>
        </div>
        <textarea id="inputText" placeholder="الصق النص الذي تريد ترجمته هنا..." spellcheck="false"></textarea>
      </div>

      <div class="card">
        <div class="card-head">
          <label for="outputText">الترجمة</label>
          <button class="mini-btn" id="copyBtn" title="نسخ الترجمة" aria-label="نسخ الترجمة">📋</button>
        </div>
        <textarea id="outputText" readonly placeholder="ستظهر الترجمة هنا..."></textarea>
      </div>
    </section>

    <!-- Actions -->
    <div class="actions-row">
      <button class="btn primary big" id="translateBtn">
        <span class="btn-text">ترجمة</span>
        <span class="spinner" hidden aria-hidden="true"></span>
      </button>

      <label class="switch-row" for="voiceToggle">
        <span aria-hidden="true">🔊</span>
        <span>ترجمة صوتية</span>
        <input type="checkbox" id="voiceToggle" />
        <span class="switch" aria-hidden="true"></span>
      </label>
    </div>

    <!-- Colors panel -->
    <section class="card" id="colorsPanel" hidden>
      <div class="card-head">
        <h2>ألوان الموقع</h2>
        <button class="mini-btn" id="closeColors" title="إغلاق" aria-label="إغلاق">✕</button>
      </div>
      <div class="colors-grid">
        <div class="color-field">
          <label for="primaryColor">اللون الأساسي</label>
          <input type="color" id="primaryColor" value="#14b8a6" />
        </div>
        <div class="color-field">
          <label for="secondaryColor">اللون الثانوي</label>
          <input type="color" id="secondaryColor" value="#0d9488" />
        </div>
        <div class="color-field">
          <label for="bgColor">الخلفية</label>
          <input type="color" id="bgColor" value="#f0fdfa" />
        </div>
      </div>
      <button class="btn ghost" id="resetColors">استعادة الألوان الافتراضية</button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
